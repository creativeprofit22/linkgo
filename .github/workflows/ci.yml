name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.2"
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Quality gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        os:
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-03
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: windows
          add-job-id-key: "false"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install chromium

      - name: Run release gate
        run: bun run check

  supply-chain:
    name: Dependency and secret scanning
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_AUDIT_VERSION: "0.22.2"
      GITLEAKS_VERSION: "8.30.1"
      # Official gitleaks_8.30.1_windows_x64.zip checksum from the release checksums file.
      GITLEAKS_SHA256: "d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e"

    steps:
      - name: Check out repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version $env:CARGO_AUDIT_VERSION

      - name: Audit dependencies against reviewed exceptions
        run: bun run check:deps

      - name: Download and verify gitleaks
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "gitleaks.zip"
          $url = "https://github.com/gitleaks/gitleaks/releases/download/v$env:GITLEAKS_VERSION/gitleaks_$($env:GITLEAKS_VERSION)_windows_x64.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($actual -ne $env:GITLEAKS_SHA256) { throw "gitleaks checksum mismatch" }
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "gitleaks")

      - name: Scan repository history for secrets
        run: |
          & (Join-Path $env:RUNNER_TEMP "gitleaks\gitleaks.exe") git . --redact --no-banner --exit-code 1

  package-windows:
    name: Package Windows desktop app
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
    needs: [check, supply-chain]
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-03
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: windows
          add-job-id-key: "false"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build MSI and NSIS bundles
        run: bun run tauri:build

      - name: Upload Windows installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linkgo-windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
