[package]
name = "linkgo"
version = "0.1.0"
description = "Local-first LinkedIn growth operations cockpit"
authors = ["Linkgo"]
edition = "2021"

[lib]
name = "linkgo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already in the dependency graph; match JS Unicode letter/number hashtag semantics.
regex = "=1.12.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
oauth2 = { version = "5", default-features = false }
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }
# `net` powers the provider transport's private-address-filtering DNS resolver.
tokio = { version = "1", features = ["macros", "net", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
chrono = "0.4.45"
chrono-tz = "0.10.4"
# Already in the dependency graph; match the renderer's WHATWG `URL` parsing and
# `String.prototype.normalize("NFKC")` for native candidate-policy enforcement.
url = "=2.5.8"
unicode-normalization = "=0.1.25"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2"

[dev-dependencies]
tempfile = "3"
